services:
  backend:
    build:
      context: ./Backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/echo_mind.db
      CORS_ORIGINS: http://localhost
    volumes:
      - chatdesk-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
    restart: unless-stopped

volumes:
  chatdesk-data:
